<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Baking Chatbot</title>
    <script>
        async function sendMessage() {
            const message = document.getElementById("message").value;
            const response = await fetch("/chat", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ message })
            });
            const data = await response.json();
            document.getElementById("response").innerText = data.response;
        }
    </script>


</head>

<body>
    <br><br><br><br><br>
    <div class="container">
    <h1>Baking Chatbot</h1>
    <input type="text" id="message" placeholder="Ask for a recipe...">
    <button onclick="sendMessage()">Send</button>
    <p id="response"></p>
</div>
    <style>
body {
    font-family: Arial, sans-serif;
    background-color: #7D1C4A;
    margin: 0;
    padding: 20px;
}

h1 {
    text-align: center;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                font-size: 40px;
                font-style: italic;
}

input[type="text"] {
    background-color: #F4CCE9;
            font-size: 20px;
            border-radius: 12px;
            padding: 10px;
            border: 3px solid #56021F;
}

button {
    background-color: #F4CCE9;
            font-size: 20px;
            border-radius: 12px;
            padding: 10px;
            border: 3px solid #56021F;
}

button:hover {
    background-color: #F4CCE9;
}

#response {
    margin-top: 20px;
    padding: 10px;
    background-color: #F4CCE9;
    border:3px solid #56021F;
    border-radius: 4px;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    background: #D17D98;
                width: 500px;
                padding: 30px;
                border-radius: 20px;
                box-shadow: 0px 0px 10px 10px #56021F;
                margin: auto;
                margin-top: 10px;
}
    </style>
</body>
</html>
